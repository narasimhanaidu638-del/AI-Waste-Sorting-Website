<section id="ai-scanner">
    <h2>♻️ AI Waste Scanner</h2>

    <p>Upload a waste image and let AI detect the object.</p>

    <input
        type="file"
        id="wasteImage"
        accept="image/*"
    >

    <button id="scanBtn">
        🔍 Scan Waste
    </button>

    <div id="result">
        Upload an image to begin.
    </div>
</section>
